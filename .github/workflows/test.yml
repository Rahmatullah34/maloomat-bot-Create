name: Bot tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check index.js && node --check lib/moderation.js && node --check lib/auto-publisher.js && node --check lib/answer-plan.js && node --check lib/answer-delivery.js && node --check lib/web-search.js && node --check lib/search-relevance.js && node --check lib/religious-source-policy.js && node --check lib/book-source-policy.js
      - name: Run unit and regression tests
        run: npm test

name: Keep Render service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping bot health and storage
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 90 \
            --retry 2 --retry-delay 5 \
            "https://maloomat-bot-create.onrender.com/health"
